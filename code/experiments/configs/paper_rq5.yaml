  - fixed: {sweep_factor: k, sweep_value: 10, dataset: {loader: gaussian_mixture, kwargs: {n: 1000, d: 256, k: 10, gamma: 3.0, imbalance: 1.0, seed: 12345}}, k: 10, m: 32, q: 2}
