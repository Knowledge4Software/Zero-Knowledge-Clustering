# Native (no ZK proving) grid -- Table matrix-a: full factorial over
# datasets, projection method, m, q, k; native clustering + symbolic cost
# model only (no gnark invocation). Table matrix-a's "measured" columns come
# from rq1_fidelity.py / cost_model.py evaluated on every row here.
fixed:
  precision_bits: 16
  B: 4096
  backend: groth16

grid:
  dataset:
    - {loader: gaussian_mixture, kwargs: {n: 2000, d: 256, k: 5, gamma: 3.0, imbalance: 1.0}}
    - {loader: gaussian_mixture, kwargs: {n: 2000, d: 512, k: 8, gamma: 2.0, imbalance: 2.0}}
    - {loader: dbscan_margin, kwargs: {n: 1000, d: 128, rho: 1.0, eps: 0.15}}
    - {loader: mnist, kwargs: {n_max: 5000}}
    - {loader: fashion_mnist, kwargs: {n_max: 5000}}
    - {loader: gisette, kwargs: {n_max: 3000}}
    - {loader: arcene, kwargs: {n_max: 200}}
    - {loader: 20ng_tfidf, kwargs: {n_max: 3000, max_features: 2000}}
  projection: [identity, gaussian, rademacher, achlioptas, sparse_jl, coordinate, pca, pisot]
  m: [16, 32, 64, 128, 256]
  q: [1, 2, 4]
  k: [5, 10]
  seed: [0, 1, 2]
