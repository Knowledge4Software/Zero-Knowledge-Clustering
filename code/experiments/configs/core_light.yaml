# Time-boxed light core (real-proof) grid.
# 2 datasets x 3 variants x 2 m x 2 q x 1 seed = 24 rows.
# All listed variants execute real gnark proofs.
fixed:
  precision_bits: 16
  B: 4096
  backend: groth16
  n_reps_proof: 3
  n_warmup_proof: 1
  range_bits: 20

grid:
  dataset:
    - {loader: gaussian_mixture, kwargs: {n: 8, d: 32, k: 3, gamma: 3.0, imbalance: 1.0}}
    - {loader: gaussian_mixture, kwargs: {n: 12, d: 32, k: 3, gamma: 3.0, imbalance: 1.0}}
  variant: [sparse, full, prepublished]
  m: [8, 16]
  q: [1, 4]
  seed: [0]
