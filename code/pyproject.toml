[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commitjl"
version = "0.1.0"
description = "CommitJL: zero-knowledge clustering via commit-then-sample sparse JL projection (P1/P2 reference implementation)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "pyyaml",
    "matplotlib",
    "psutil",
    "pycryptodome",
    "tqdm",
]

[tool.setuptools]
packages = ["commitjl"]
