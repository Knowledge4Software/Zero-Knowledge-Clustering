[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commitjl"
version = "0.1.0"
description = "Reusable authenticated certificates for exact quantized prototype-update decisions"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "jinja2",
    "pyarrow",
    "pyyaml",
    "matplotlib",
    "psutil",
    "pycryptodome",
    "tqdm",
]

[tool.setuptools]
packages = ["commitjl"]
