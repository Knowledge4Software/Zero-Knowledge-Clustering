  <g id="text_12">
   <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18354d" x="13.32" y="21.013819" transform="rotate(-0 13.32 21.013819)">Why bounded refinement can resolve an update</text>
  </g>
  <g id="text_13">
   <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="34.565691" transform="rotate(-0 13.32 34.565691)">Exact-row corrections shrink an authenticated interval without changing its guarantee.</text>
  </g>
  <g id="text_14">
   <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="254.836609" transform="rotate(-0 13.32 254.836609)">Illustrative intervals, not experimental results. If the budget does not resolve the sign, the service must prove an exact fallback.</text>
