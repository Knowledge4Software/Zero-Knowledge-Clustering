   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #236a95" x="27.49248" y="74.462166" transform="rotate(-0 27.49248 74.462166)">Exact decomposition</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 88.247164)">Δ = A + Σ bᵢ</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 98.220398)"/>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 108.193633)">A: exact assigned-center change</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 118.166867)">bᵢ ≤ 0: benefit from switching centers</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 128.140101)"/>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 138.113336)">Refine rows by descending interval width.</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 148.08657)">Every exact correction needs its own proof.</text>
   </g>
