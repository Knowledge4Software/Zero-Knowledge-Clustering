  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18354d" x="13.32" y="21.859819" transform="rotate(-0 13.32 21.859819)">Repeated prototype audits: where reuse can help</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="36.563691" transform="rotate(-0 13.32 36.563691)">The catalog and deployed reference stay fixed; each request supplies a new candidate bank.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="272.386609" transform="rotate(-0 13.32 272.386609)">One cache epoch: fixed X, reference C⁰, basis and quantization. Changing that contract requires new authenticated state.</text>
  </g>
