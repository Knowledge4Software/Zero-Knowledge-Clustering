    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="276.5232" y="233.14824" transform="rotate(-0 276.5232 233.14824)">Reuse pays only if savings cover preparation and fallback.</text>
