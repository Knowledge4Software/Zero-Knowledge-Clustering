   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="27.49248" y="73.348686" transform="rotate(-0 27.49248 73.348686)">K: circuit / key setup</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.85px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 86.90981)">Compile, generate and serialize keys</text>
    <text style="font-size: 6.85px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 96.14179)">Reuse only under valid model / key pins</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="199.58688" y="73.348686" transform="rotate(-0 199.58688 73.348686)">P: epoch preparation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 87.023786)">Fit, summarize, commit, authenticate</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 96.457927)">Rows, old groups and private moments</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #236a95" x="371.68128" y="73.348686" transform="rotate(-0 371.68128 73.348686)">R: changing-request work</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 87.023786)">Plan + witness + prove + verify + I/O</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 96.457927)">Charge selected corrections and Full</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18354d" x="266.4" y="145.29456" transform="rotate(-0 266.4 145.29456)">T(Q) = K + P + L(Q) + Σₜ Rₜ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #677888" x="266.4" y="165.80736" transform="rotate(-0 266.4 165.80736)">L(Q) includes process / batch key loading; it is not key generation.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="27.49248" y="202.579326" transform="rotate(-0 27.49248 202.579326)">Epoch 1: X, C⁰, B</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 215.722536)">Prepare again when the cache changes</text>
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 224.213262)">New setup too if circuit/model pins change</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad6b1b" x="199.58688" y="202.579326" transform="rotate(-0 199.58688 202.579326)">Epoch 2: changed reference</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 215.722536)">Prepare again when the cache changes</text>
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 224.213262)">New setup too if circuit/model pins change</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad6b1b" x="371.68128" y="202.579326" transform="rotate(-0 371.68128 202.579326)">Epoch 3: changed catalog</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 215.722536)">Prepare again when the cache changes</text>
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 224.213262)">New setup too if circuit/model pins change</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18354d" x="13.32" y="21.183019" transform="rotate(-0 13.32 21.183019)">Measure amortization within the lifetime of a valid cache</text>
  </g>
  <g id="text_16">
   <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="34.965291" transform="rotate(-0 13.32 34.965291)">Count native compression, authentication, key work, query work and every fallback.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="258.346609" transform="rotate(-0 13.32 258.346609)">A long sequence amortizes preparation only while its authenticated contract stays valid. More requests do not guarantee a crossing.</text>
  </g>
 </g>
