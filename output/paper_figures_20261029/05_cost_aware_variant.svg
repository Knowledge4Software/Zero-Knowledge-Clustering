    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>The tested cost-aware engineering variant. Native exact computations only select witness work. A batch activates compact proofs only when predicted savings cover loading/setup and a margin. Every request is retained and publicly verified. This variant is not silently inserted into the existing methodology text.</dc:description>
