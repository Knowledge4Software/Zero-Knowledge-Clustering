   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 95.764586)">Cached heads / energies / moments</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 105.198727)">Plan ≤16 exact-row corrections</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 114.632868)">Estimate proofs + key loading</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 124.067008)">Charge this native computation</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ad6b1b" transform="translate(227.34215 105.471335)">Conclusive and</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ad6b1b" transform="translate(226.75215 114.429585)">cheaper batch?</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="376.74288" y="74.826846" transform="rotate(-0 376.74288 74.826846)">Compact + exact corrections</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263442" x="376.74288" y="89.126137" transform="rotate(-0 376.74288 89.126137)">Generate and verify actual proofs</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="376.74288" y="154.826766" transform="rotate(-0 376.74288 154.826766)">Direct exact Full</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263442" x="376.74288" y="169.126058" transform="rotate(-0 376.74288 169.126058)">Skip failed compact work</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="337.2624" y="81.79704" transform="rotate(-0 337.2624 81.79704)">yes</text>
