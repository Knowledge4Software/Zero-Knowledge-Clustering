  <g id="text_12">
   <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18354d" x="13.32" y="21.859819" transform="rotate(-0 13.32 21.859819)">Engineering variant: choose proof work before proving</text>
  </g>
  <g id="text_13">
   <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="36.563691" transform="rotate(-0 13.32 36.563691)">The planner is untrusted. Both branches must verify against the same catalog and approved requests.</text>
  </g>
  <g id="text_14">
   <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="272.386609" transform="rotate(-0 13.32 272.386609)">Cost-aware scheduling applies to both centroid and PCA certificates. Public routing choices and refinement indices are observable outputs.</text>
  </g>
