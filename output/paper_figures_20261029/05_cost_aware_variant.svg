   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18354d" x="27.49248" y="206.718606" transform="rotate(-0 27.49248 206.718606)">Public verifier: derive the answer from proofs</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 221.093882)">Same raw root and approved centers; complete disjoint request coverage</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 230.393249)">No answer is accepted solely because the native planner predicted it.</text>
   </g>
