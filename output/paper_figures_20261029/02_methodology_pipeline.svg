   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="18.3816" y="56.32632" transform="rotate(-0 18.3816 56.32632)">PREPARATION FOR ONE FIXED EPOCH</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="27.49248" y="86.771933" transform="rotate(-0 27.49248 86.771933)">1  Fit and freeze representation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 103.585586)">Training data + deployed reference C⁰</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 113.019727)">Prediction basis B₆₃; certificate B₇₉</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 122.453868)">Fix quantization and integer scale T</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="199.58688" y="86.999886" transform="rotate(-0 199.58688 86.999886)">2  Build private summaries</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 103.585586)">Catalog X → heads H and energies E</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 113.019727)">Exact old nearest groups g</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 122.453868)">Group counts n and sums S</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #217f73" x="371.68128" y="86.999886" transform="rotate(-0 371.68128 86.999886)">3  Commit and authenticate</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 103.433617)">Salted original / derived / moment roots</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 112.598211)">Auditor challenge ξ after commitment</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 121.776618)">Prove every row and its statistics</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #236a95" x="18.3816" y="187.08156" transform="rotate(-0 18.3816 187.08156)">EACH APPROVED CANDIDATE BANK Cᵗ</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #236a95" x="27.49248" y="217.755126" transform="rotate(-0 27.49248 217.755126)">4  Exact assigned change A</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 234.340826)">Private counts and coordinate sums</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 243.774967)">Approved original-space centers</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(27.49248 253.209108)">Prove moment linkage + exact change</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #236a95" x="199.58688" y="217.755126" transform="rotate(-0 199.58688 217.755126)">5  Bound switching corrections</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 234.340826)">Rounded-basis Gram correction</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 243.774967)">Integer residual-radius envelopes</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(199.58688 253.209108)">L ≤ T⁶Δ ≤ U, with Δ = A + Σ bᵢ</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad6b1b" x="371.68128" y="217.755126" transform="rotate(-0 371.68128 217.755126)">6  Verify the decision</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 234.188858)">Check roots, keys and full row coverage</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 243.353451)">Conclusive? Refine ≤16 exact rows</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #263442" transform="translate(371.68128 252.518045)">or prove an exact Full fallback</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #217f73" x="433.4328" y="179.837113" transform="rotate(-0 433.4328 179.837113)">Reusable authenticated state</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18354d" x="13.32" y="23.721019" transform="rotate(-0 13.32 23.721019)">Method overview: authenticate once, verify changing candidates</text>
  </g>
  <g id="text_17">
   <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="40.959291" transform="rotate(-0 13.32 40.959291)">The high-dimensional assigned contribution is exact; uncertainty is isolated to switching.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677888" x="13.32" y="310.996609" transform="rotate(-0 13.32 310.996609)">Current centroid / PCA certificate profile. Candidate values may leave the fitted span; larger residuals can make bounds inconclusive.</text>
  </g>
